additionalProperties:
  formFields:
    - default: 40203
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      required: true
      rule: paramPort
      type: number
    - default: example.com
      edit: true
      envKey: ALLOWED_ORIGINS
      labelEn: Allowed domain (multiple delimited with ",")
      labelZh: 被允许的域名 (多个使用英文逗号分割)
      required: true
      type: text
    - default: "mongodb"
      edit: true
      envKey: DB_HOST
      key: mongodb
      labelEn: Database Service
      labelZh: 数据库服务
      required: true
      type: service
    - default: 27017
      edit: true
      envKey: DB_PORT
      labelEn: Database Port
      labelZh: 数据库端口
      required: false
      rule: paramPort
      type: number
    - default: "mx-space"
      edit: true
      envKey: DB_NAME
      labelEn: Database Name
      labelZh: 数据库名
      required: true
      rule: paramCommon
      type: text
    - default: "mx-space"
      edit: true
      envKey: DB_USER
      labelEn: Database User Name
      labelZh: 数据库用户名
      required: true
      rule: paramCommon
      type: text
    - default: ""
      edit: true
      envKey: DB_PASSWORD
      labelEn: Database User Password
      labelZh: 数据库密码
      required: true
      rule: paramCommon
      type: password
    - default: ""
      edit: true
      envKey: REDIS_HOST
      key: redis
      labelEn: Redis Service
      labelZh: 缓存服务
      required: true
      type: service
    - default: ""
      envKey: REDIS_PASSWORD
      labelEn: Redis Service Password
      labelZh: 缓存密码
      required: true
      type: password
    - default: 6379
      edit: true
      envKey: REDIS_PORT
      labelEn: Redis Port
      labelZh: Redis端口
      required: false
      type: number
    - default: 0
      edit: true
      envKey: REDIS_DB_NAME
      labelEn: Redis Database Name
      labelZh: Redis数据库名
      required: false
      type: number
    - default: Np2qgqtiUayA857a
      edit: true
      envKey: JWT_SECRET
      labelEn: JWT key (16 to 32 characters)
      labelZh: JWT 密钥 (16 到 32 位字符)
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ''
      edit: true
      envKey: ENCRYPT_KEY
      labelEn: Encryption key (not recommended for non-special needs, run "openssl rand -hex 32" on the terminal to obtain it)
      labelZh: 加密密钥 (非特殊需求不建议填写,终端执行 "openssl rand -hex 32" 获取)
      required: false
      type: text
    - default: "false"
      edit: true
      envKey: ENCRYPT_ENABLE
      labelEn: Whether to enable encryption (true or false, if you want to enable it, you need to enter the encryption key)
      labelZh: 是否开启加密 (true或false,开启则需要填写加密密钥)
      required: true
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: TIME_ZONE
      labelEn: Time zone
      labelZh: 时区
      required: true
      type: text